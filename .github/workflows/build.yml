name: Build MinisToolLive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          sw_vers

      - name: Install Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          # Theos 在 macOS 上直接用 Xcode 自带工具链，无需额外下载
          ls "$THEOS/bin" | head -20
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin"   >> "$GITHUB_PATH"

      - name: Install ldid (Theos 签名必需)
        run: |
          set -e
          brew install ldid || true
          if ! command -v ldid >/dev/null 2>&1; then
            echo "::warning::brew ldid 不可用，尝试 Theos 自带 toolchain"
            find "$THEOS" -name 'ldid*' -type f 2>/dev/null | head -5 || true
          fi
          command -v ldid && ldid -v 2>&1 | head -2 || echo "ldid 仍缺失"

      - name: Lint plist and control
        run: |
          set -e
          plutil -lint MinisToolLive.plist
          echo "--- control ---"
          cat control

      - name: Build package
        run: |
          set -e
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 DEBUG=0 THEOS_PACKAGE_SCHEME=rootless
          echo "=== packages ==="
          ls -la packages/ || true

      - name: Verify deb
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -1)
          echo "DEB=$DEB"
          echo "=== ar 结构 ==="
          ar t "$DEB" || true
          echo "=== control ==="
          mkdir -p /tmp/x && cd /tmp/x && rm -rf ./* 
          ar x "$OLDPWD/$DEB" control.tar.gz data.tar.gz 2>/dev/null || \
            ar x "$OLDPWD/$DEB" 2>/dev/null || true
          ls -la
          for f in control.tar.gz control.tar.xz control.tar.zst; do
            [ -f "$f" ] && echo "--- $f ---" && tar -xf "$f" -O ./control 2>/dev/null | head -20
          done
          echo "=== data 内容 ==="
          for f in data.tar.gz data.tar.xz data.tar.zst; do
            [ -f "$f" ] && echo "--- $f ---" && tar -tf "$f" | head -20
          done
          echo "=== sha256 ==="
          shasum -a 256 "$OLDPWD/$DEB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinisToolLive-deb
          path: packages/*.deb
          if-no-files-found: error
